name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

# A newer run on the same ref replaces the one in progress (saves minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Runs on every PR and every push to main. Linux is the cheapest runner (1x minutes),
  # so it carries the full check, including formatting. Windows has its own workflow
  # (ci-windows.yml), which runs only when the change can behave differently there.
  linux:
    name: Build, test and format (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 10.0.x (not the exact version in global.json) so CI follows the SDK feature band
      # used locally; global.json still enforces the minimum via rollForward.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # The data refresh tool is a single file outside the solution; this keeps it from rotting.
      - name: Build the data tool
        run: dotnet build tools/update-ourairports.cs --configuration Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore
