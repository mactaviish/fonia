name: CI (Windows)

# Windows minutes cost 2x on private repositories, so this runs only when it can tell something the Linux job cannot:
#  - on pull requests that change code (src, tests, build settings), not documentation or spikes;
#  - on every push to main (documentation aside), so main is always checked on Windows too;
#  - on demand (Actions > CI (Windows) > Run workflow), to try a branch before opening a pull request.
# The Linux job (ci.yml) still runs on everything and also checks formatting.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '*.sln'
      - '.github/workflows/ci-windows.yml'
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

# A newer run on the same ref replaces the one in progress (saves minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build
